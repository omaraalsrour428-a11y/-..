<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة مناقشة مشروع التخرج - د. عمر أحمد السرور</title>
<meta name="description" content="دعوة لحضور مناقشة مشروع التخرج في طب الأسنان وجراحتها">
  <meta property="og:type" content="website">
<meta property="og:title" content="دعوة لحضور مناقشة مشروع التخرج - د. عمر أحمد السرور">
<meta property="og:description" content="دعوة لحضور مناقشة مشروع التخرج في طب الأسنان وجراحتها">
<meta property="og:image" content="https://omaraalsrour428-a11y.github.io/-../preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10393f;--navy:#1f5a61;--navy2:#2f747b;--blue:#c9a24b;--sky:#cfe3e2;--paper:#f8fbff;--gold:#c9a24b;--gold2:#f0d78c;--w:min(88vw,430px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Cairo,Tahoma,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#ffffff 0%,#eaf2f1 55%,#d3e3e2 100%);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:24px;transition:opacity .7s,transform .7s}
.stage.gone{opacity:0;transform:translateY(40px);pointer-events:none}
.hint{color:var(--navy);font-weight:600;font-size:17px;text-align:center;line-height:1.8}
.hint b{display:block;font-family:"Aref Ruqaa",serif;font-size:30px;color:var(--gold2);font-weight:700}
.env{position:relative;width:var(--w);height:calc(var(--w)*.68);perspective:1400px;filter:drop-shadow(0 26px 34px rgba(16,57,63,.35))}
.back{position:absolute;inset:0;background:#184a50;border-radius:16px}
.mini{position:absolute;left:6%;right:6%;top:7%;height:86%;border-radius:10px;z-index:2;overflow:hidden;transition:transform 1s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 0 1px var(--sky)}
.mini img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.front{position:absolute;inset:0;z-index:3;border-radius:16px;background:linear-gradient(160deg,#2f747b,#1d5258);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-bottom:5px solid var(--blue)}
.flap{position:absolute;top:0;left:0;width:100%;height:54%;background:linear-gradient(180deg,#44898f,#2f747b);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform .8s ease,z-index 0s .4s;border-radius:16px 16px 0 0}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.out .mini{transform:translateY(-62%)}
.seal{position:absolute;left:50%;top:54%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:5;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 55%,#8f6d22);box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 0 0 5px rgba(255,255,255,.18),inset 0 0 0 9px rgba(120,80,10,.25);transition:transform .35s,opacity .35s;display:grid;place-items:center}
.seal::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold2);animation:ring 2s infinite}
.seal:focus-visible{outline:3px solid #fff;outline-offset:6px}
.seal svg{width:54px;height:54px}
.env.open .seal{transform:scale(1.3) rotate(-12deg);opacity:0;pointer-events:none}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
#invite{display:none;padding:28px 16px 48px;justify-content:center}
#invite.show{display:flex;animation:in .9s ease both}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.full{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:20px}
.full img{width:100%;height:auto;border-radius:18px;box-shadow:0 26px 50px rgba(16,57,63,.3);display:block}
.btn{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:13px 24px;background:var(--blue);color:#fff;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="mini"><img src="invitation.jpg" alt="دعوة مناقشة مشروع التخرج"></div>
    <div class="front"></div>
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="افتح الدعوة">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="32,14 58,27 32,40 6,27" fill="#10393f"/>
        <path d="M17 34v10c0 5 30 5 30 0V34l-15 8z" fill="#1f5a61"/>
        <path d="M54 28v14" stroke="#10393f" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="54" cy="45" r="3" fill="#10393f"/>
      </svg>
    </button>
  </div>
  <p class="hint">اضغط لفتح الدعوة</p>
</main>

<section id="invite" aria-label="الدعوة">
  <div class="full">
    <img src="invitation.jpg" alt="دعوة مناقشة مشروع التخرج - د. عمر أحمد السرور">
  </div>
</section>

<script>
(function(){
  var env=document.getElementById('env'),seal=document.getElementById('seal'),
      stage=document.getElementById('stage'),inv=document.getElementById('invite'),opened=false;
  function open(){
    if(opened)return;opened=true;
    env.classList.add('open');
    setTimeout(function(){env.classList.add('out')},650);
    setTimeout(function(){stage.classList.add('gone')},1900);
    setTimeout(function(){stage.style.display='none';inv.classList.add('show');window.scrollTo(0,0)},2600);
  }
  seal.addEventListener('click',open);

})();
</script>
</body>
</html>
